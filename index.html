<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Website Widgets</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;

      max-width: 760px;

      margin: 60px auto;
      padding: 0 25px 80px;

      background: #ffffff;
      color: #222222;
    }


    h1 {
      margin-bottom: 8px;
    }


    .intro {
      color: #666666;
      margin-bottom: 40px;
    }


    h2 {
      margin-top: 0;
    }


    /* GENERATOR */

    .generator {
      padding: 25px;

      border: 1px solid #dddddd;
      border-radius: 14px;

      margin-bottom: 40px;
    }


    label {
      display: block;

      font-size: 14px;
      font-weight: bold;

      margin-top: 18px;
      margin-bottom: 7px;
    }


    input {
      display: block;

      width: 100%;

      padding: 12px 14px;

      border: 1px solid #cccccc;
      border-radius: 8px;

      font-size: 15px;
    }


    input:focus {
      outline: 2px solid #999999;
      outline-offset: 1px;
    }


    button {
      padding: 12px 18px;

      border: 0;
      border-radius: 8px;

      background: #222222;
      color: #ffffff;

      font-size: 15px;

      cursor: pointer;

      transition: transform 0.15s ease;
    }


    button:hover {
      transform: scale(1.03);
    }


    .create-button {
      margin-top: 20px;
    }


    /* RESULT */

    .result {
      display: none;

      margin-top: 25px;
      padding-top: 20px;

      border-top: 1px solid #eeeeee;
    }


    .result-url {
      padding: 12px;

      background: #f5f5f5;

      border-radius: 8px;

      font-size: 13px;

      word-break: break-all;

      margin-top: 10px;
      margin-bottom: 10px;
    }


    .copy-message {
      display: none;

      margin-top: 10px;

      font-size: 13px;
      color: #666666;
    }


    /* PREVIEW */

    .preview-title {
      margin-top: 25px;
      margin-bottom: 10px;

      font-size: 14px;
      font-weight: bold;
    }


    iframe {
      width: 100%;
      height: 320px;

      border: 1px solid #eeeeee;
      border-radius: 8px;

      background: #ffffff;
    }


    /* SAVE + CLEAR */

    .result-actions {
      display: flex;

      gap: 10px;

      margin-top: 18px;

      flex-wrap: wrap;
    }


    .save-button {
      background: #222222;
    }


    .clear-button {
      background: #eeeeee;
      color: #222222;
    }


    /* WIDGET LIBRARY */

    .widgets-title {
      margin-top: 45px;
      margin-bottom: 18px;
    }


    .widgets-grid {
      display: flex;

      flex-wrap: wrap;

      gap: 14px;

      align-items: flex-start;
    }


    .saved-widget {
      width: 90px;
      height: 90px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 8px;

      border: 1px solid #dddddd;
      border-radius: 10px;

      background: #fafafa;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }


    .saved-widget:hover {
      transform: scale(1.07);
      border-color: #aaaaaa;
    }


    .saved-widget img {
      display: block;

      max-width: 100%;
      max-height: 100%;

      width: auto;
      height: auto;

      object-fit: contain;

      image-rendering: pixelated;
    }


    .empty-widgets {
      color: #888888;
      font-size: 14px;
    }

  </style>
</head>


<body>

  <h1>My Website Widgets</h1>

  <p class="intro">
    Интерактивные элементы для моего сайта.
  </p>


  <div class="generator">

    <h2>✨ Interactive Button Generator</h2>

    <p>
      Создай интерактивную кнопку для Notion
      с увеличением и поворотом при наведении.
    </p>


    <label for="image">
      Имя изображения на GitHub
    </label>

    <input
      id="image"
      type="text"
      placeholder="например: kitty-Scarameow.gif"
    >


    <label for="link">
      Куда должна вести кнопка
    </label>

    <input
      id="link"
      type="url"
      placeholder="https://..."
    >


    <button
      class="create-button"
      onclick="createButton()"
    >
      Создать кнопку
    </button>


    <div
      class="result"
      id="result"
    >

      <strong>
        Ссылка для Notion Embed:
      </strong>


      <div
        class="result-url"
        id="result-url"
      ></div>


      <button onclick="copyURL()">
        Скопировать ссылку
      </button>


      <div
        class="copy-message"
        id="copy-message"
      >
        Скопировано ✓
      </div>


      <div class="preview-title">
        Предпросмотр:
      </div>


      <iframe
        id="preview"
        title="Button preview"
      ></iframe>


      <div class="result-actions">

        <button
          class="save-button"
          onclick="saveWidget()"
        >
          Сохранить?
        </button>


        <button
          class="clear-button"
          onclick="clearForm()"
        >
          Очистить форму
        </button>

      </div>

    </div>

  </div>


  <h2 class="widgets-title">
    Widgets
  </h2>


  <div
    class="widgets-grid"
    id="widgets-grid"
  ></div>


  <script>

    let generatedURL = "";


    /*
      Создание ссылки
    */

    function createButton() {

      const image =
        document
          .getElementById("image")
          .value
          .trim();


      const link =
        document
          .getElementById("link")
          .value
          .trim();


      if (!image) {

        alert("Укажи имя изображения.");

        return;
      }


      if (!link) {

        alert("Вставь ссылку для кнопки.");

        return;
      }


      const base =
        window.location.origin +
        window.location.pathname +
        "button/";


      generatedURL =
        base +
        "?image=" +
        encodeURIComponent(image) +
        "&link=" +
        encodeURIComponent(link);


      document
        .getElementById("result-url")
        .textContent =
        generatedURL;


      document
        .getElementById("preview")
        .src =
        generatedURL;


      document
        .getElementById("result")
        .style
        .display =
        "block";


      document
        .getElementById("copy-message")
        .style
        .display =
        "none";
    }



    /*
      Копирование ссылки
    */

    async function copyURL() {

      if (!generatedURL) {
        return;
      }


      try {

        await navigator.clipboard.writeText(
          generatedURL
        );


        document
          .getElementById("copy-message")
          .style
          .display =
          "block";

      }

      catch (error) {

        alert(
          "Не удалось скопировать автоматически."
        );

      }
    }



    /*
      Сохранение виджета
    */

    function saveWidget() {

      const image =
        document
          .getElementById("image")
          .value
          .trim();


      const link =
        document
          .getElementById("link")
          .value
          .trim();


      if (!generatedURL || !image || !link) {

        alert(
          "Сначала создай кнопку."
        );

        return;
      }


      const widgets =
        JSON.parse(
          localStorage.getItem(
            "myWebsiteWidgets"
          )
        ) || [];


      /*
        Не сохраняем одну и ту же
        кнопку два раза.
      */

      const alreadyExists =
        widgets.some(
          widget =>
            widget.url === generatedURL
        );


      if (alreadyExists) {

        alert(
          "Этот виджет уже сохранён."
        );

        return;
      }


      widgets.push({

        image: image,

        link: link,

        url: generatedURL

      });


      localStorage.setItem(
        "myWebsiteWidgets",
        JSON.stringify(widgets)
      );


      renderWidgets();


      alert("Виджет сохранён ✓");
    }



    /*
      Очистка формы
    */

    function clearForm() {

      document
        .getElementById("image")
        .value =
        "";


      document
        .getElementById("link")
        .value =
        "";


      document
        .getElementById("preview")
        .src =
        "about:blank";


      document
        .getElementById("result")
        .style
        .display =
        "none";


      document
        .getElementById("copy-message")
        .style
        .display =
        "none";


      generatedURL = "";


      document
        .getElementById("image")
        .focus();
    }



    /*
      Отображение сохранённых виджетов
    */

    function renderWidgets() {

      const grid =
        document
          .getElementById("widgets-grid");


      grid.innerHTML = "";


      const widgets =
        JSON.parse(
          localStorage.getItem(
            "myWebsiteWidgets"
          )
        ) || [];


      if (widgets.length === 0) {

        grid.innerHTML =
          '<div class="empty-widgets">' +
          'Здесь появятся сохранённые виджеты.' +
          '</div>';

        return;
      }


      widgets.forEach(widget => {

        const item =
          document.createElement("a");


        item.className =
          "saved-widget";


        /*
          Клик по маленькой картинке
          открывает сам виджет.
        */

        item.href =
          widget.url;


        item.target =
          "_blank";


        const image =
          document.createElement("img");


        image.src =
          "./" + widget.image;


        image.alt =
          "Saved widget";


        item.appendChild(image);

        grid.appendChild(item);

      });

    }



    /*
      Показываем сохранённые кнопки
      сразу после открытия страницы.
    */

    renderWidgets();

  </script>

</body>

</html>
