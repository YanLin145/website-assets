<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Website Widgets</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 0 25px;
      background: #ffffff;
      color: #222222;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 35px;
    }

    .widget {
      display: block;
      padding: 18px 20px;
      margin-bottom: 12px;

      border: 1px solid #dddddd;
      border-radius: 10px;

      color: #222222;
      text-decoration: none;

      transition: transform 0.2s ease;
    }

    .widget:hover {
      transform: scale(1.02);
    }

    .widget-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .widget-description {
      font-size: 14px;
      color: #666666;
    }
  </style>
</head>

<body>

  <h1>My Website Widgets</h1>

  <p>
    Интерактивные элементы для моего сайта.
  </p>

  <a class="widget" href="./cat-button/">
    <div class="widget-name">
      🐱 Darkflowertale Button
    </div>

    <div class="widget-description">
      Декоративная GIF-кнопка со Скарамяуччей
    </div>
  </a>

</body>

</html>
