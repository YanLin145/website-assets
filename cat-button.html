<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .art-button {
      display: inline-block;
      padding: 30px;
    }

    .art-button img {
      display: block;
      width: 300px;
      height: auto;

      transform: scale(1) rotate(0deg);
      transition: transform 0.25s ease;

      cursor: pointer;
    }

    .art-button:hover img {
      transform: scale(1.1) rotate(3deg);
    }
  </style>
</head>

<body>

  <a
    class="art-button"
    href="https://yanisky.notion.site/Darkflowertale-cbdeb1a059134069abb1d192c36dcfd0"
    target="_blank"
  >
    <img
      src="https://raw.githubusercontent.com/yanisky-art/website-assets/refs/heads/main/kitty-Scarameow.gif"
      alt="Darkflowertale"
    >
  </a>

</body>
</html>
