<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow: hidden;
    }

    .art-button {
      display: block;
      width: 100%;
      box-sizing: border-box;

      /* Больше свободного пространства вокруг котика */
      padding: 45px;
    }

    .art-button img {
      display: block;

      /* Котик подстраивается под ширину рамки Notion */
      width: 100%;
      height: auto;

      /* Сохраняем пиксельную чёткость */
      image-rendering: pixelated;

      transform: scale(1) rotate(0deg);
      transform-origin: center;

      transition: transform 0.25s ease;
      cursor: pointer;
    }

    /* Сильный эффект при наведении */
    .art-button:hover img {
      transform: scale(1.35) rotate(12deg);
    }
  </style>
</head>

<body>

  <a
    class="art-button"
    href="https://yanisky.notion.site/Darkflowertale-cbdeb1a059134069abb1d192c36dcfd0"
    target="_blank"
  >
    <img
      src="../kitty-Scarameow.gif"
      alt="Darkflowertale"
    >
  </a>

</body>

</html>
