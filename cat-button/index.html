<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow: hidden;
    }

    .art-button {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      box-sizing: border-box;

      /* Рабочая зона безопасности */
      padding: 50%;
    }

    .art-button img {
      display: block;

      /* Рабочее масштабирование рамкой Notion */
      width: 100%;
      height: auto;

      /* Чёткая пиксельная графика */
      image-rendering: pixelated;

      transform: scale(1) rotate(0deg);
      transform-origin: center center;

      transition: transform 0.25s ease;
      cursor: pointer;
    }

    /* Hover только на самом котике */
    .art-button img:hover {
      transform: scale(1.35) rotate(12deg);
    }
  </style>
</head>

<body>

  <a
    class="art-button"
    href="https://yanisky.notion.site/Darkflowertale-cbdeb1a059134069abb1d192c36dcfd0"
    target="_blank"
  >
    <img
      src="../kitty-Scarameow.gif"
      alt="Darkflowertale"
    >
  </a>

</body>

</html>
