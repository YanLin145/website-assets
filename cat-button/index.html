<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: transparent;
      overflow: hidden;
    }

    .art-button {
      position: absolute;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      /*
        Автоматическая зона безопасности.
        Она считается от размеров самого iframe.
      */
      padding: 18%;
    }

    .art-button img {
      display: block;

      /*
        Картинка автоматически вписывается
        и по ширине, и по высоте.
      */
      max-width: 100%;
      max-height: 100%;

      width: auto;
      height: auto;

      object-fit: contain;

      image-rendering: pixelated;

      transform: scale(1) rotate(0deg);
      transform-origin: center center;

      transition: transform 0.25s ease;

      cursor: pointer;
    }

    .art-button:hover img {
      transform: scale(1.35) rotate(12deg);
    }
  </style>
</head>

<body>

  <a
    class="art-button"
    href="https://yanisky.notion.site/Darkflowertale-cbdeb1a059134069abb1d192c36dcfd0"
    target="_blank"
  >
    <img
      src="../kitty-Scarameow.gif"
      alt="Darkflowertale"
    >
  </a>

</body>

</html>
