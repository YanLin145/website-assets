<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YANISKY Navigation</title>
</head>

<body>

  <header class="site-header">

    <!-- Название сайта -->
    <a class="site-logo" href="#">
      YANISKY
    </a>


    <!-- Основная навигация -->
    <nav class="main-navigation" aria-label="Main navigation">

      <a class="nav-link" href="#">
        HOME
      </a>


      <!-- ART -->
      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >
          ART
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>

        <div class="dropdown">

          <a class="dropdown-link" href="#">
            TRADITIONAL
          </a>

          <a class="dropdown-link" href="#">
            DIGITAL
          </a>

        </div>

      </div>


      <!-- PROJECTS -->
      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >
          PROJECTS
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>

        <div class="dropdown">

          <a class="dropdown-link" href="#">
            GAMES
          </a>

        </div>

      </div>


      <!-- EVENTS -->
      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >
          EVENTS
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>

        <div class="dropdown">

          <a class="dropdown-link" href="#">
            EXHIBITIONS &amp; OPEN CALLS
          </a>

          <a class="dropdown-link" href="#">
            GAME JAMS
          </a>

        </div>

      </div>


      <!-- ABOUT -->
      <a class="nav-link" href="#">
        ABOUT / CONTACT
      </a>

    </nav>


    <!-- Язык -->
    <div class="language-switcher" aria-label="Language">

      <button
        class="language-button active"
        type="button"
        data-language="en"
      >
        EN
      </button>

      <span class="language-divider">|</span>

      <button
        class="language-button"
        type="button"
        data-language="ru"
      >
        RU
      </button>

    </div>

  </header>

</body>
</html>
