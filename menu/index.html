<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YANISKY Navigation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      background: #ffffff;
      color: #222222;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    button,
    a {
      font: inherit;
      color: inherit;
    }


    /* =========================
       HEADER
       ========================= */

    .site-header {
      width: 100%;
      min-height: 68px;

      display: flex;
      align-items: center;

      padding: 0 28px;
      gap: 42px;

      white-space: nowrap;
    }


    /* =========================
       LOGO
       ========================= */

    .site-logo {
      flex-shrink: 0;

      color: inherit;
      text-decoration: none;

      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.04em;
    }


    /* =========================
       MAIN NAVIGATION
       ========================= */

    .main-navigation {
      display: flex;
      align-items: center;

      gap: 30px;
    }

    .nav-group {
      position: relative;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      margin: 0;
      padding: 0;

      border: 0;
      background: none;

      color: inherit;
      text-decoration: none;

      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.035em;

      cursor: pointer;
    }


    /* =========================
       CHEVRON
       ========================= */

    .chevron {
      display: inline-block;

      font-size: 12px;
      line-height: 1;
    }


    /* =========================
       DROPDOWN
       Пока только геометрия.
       Поведение добавим позже.
       ========================= */

    .dropdown {
      display: none;

      position: absolute;
      top: calc(100% + 14px);
      left: 0;

      min-width: max-content;
    }

    .dropdown-link {
      display: block;

      padding: 5px 0;

      color: inherit;
      text-decoration: none;

      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.035em;
    }


    /* =========================
       LANGUAGE
       ========================= */

    .language-switcher {
      margin-left: auto;

      display: flex;
      align-items: center;
      gap: 7px;

      flex-shrink: 0;

      font-size: 12px;
      letter-spacing: 0.035em;
    }

    .language-button {
      margin: 0;
      padding: 0;

      border: 0;
      background: none;

      color: inherit;

      cursor: pointer;
    }

    .language-divider {
      opacity: 0.35;
    }

    .language-button:not(.active) {
      opacity: 0.55;
    }


    /* =========================
       DARK MODE
       ========================= */

    @media (prefers-color-scheme: dark) {

      body {
        background: #191919;
        color: #ffffff;
      }

    }


    /* =========================
       NARROW DESKTOP
       ========================= */

    @media (max-width: 900px) {

      .site-header {
        padding-left: 20px;
        padding-right: 20px;

        gap: 26px;
      }

      .main-navigation {
        gap: 20px;
      }

    }

  </style>
</head>

<body>

  <header class="site-header">

    <a class="site-logo" href="#">
      YANISKY
    </a>


    <nav class="main-navigation" aria-label="Main navigation">

      <a class="nav-link" href="#">
        HOME
      </a>


      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >
          ART
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>

        <div class="dropdown">

          <a class="dropdown-link" href="#">
            TRADITIONAL
          </a>

          <a class="dropdown-link" href="#">
            DIGITAL
          </a>

        </div>

      </div>


      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >
          PROJECTS
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>

        <div class="dropdown">

          <a class="dropdown-link" href="#">
            GAMES
          </a>

        </div>

      </div>


      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >
          EVENTS
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>

        <div class="dropdown">

          <a class="dropdown-link" href="#">
            EXHIBITIONS &amp; OPEN CALLS
          </a>

          <a class="dropdown-link" href="#">
            GAME JAMS
          </a>

        </div>

      </div>


      <a class="nav-link" href="#">
        ABOUT / CONTACT
      </a>

    </nav>


    <div class="language-switcher" aria-label="Language">

      <button
        class="language-button active"
        type="button"
        data-language="en"
      >
        EN
      </button>

      <span class="language-divider">|</span>

      <button
        class="language-button"
        type="button"
        data-language="ru"
      >
        RU
      </button>

    </div>

  </header>

</body>
</html>
