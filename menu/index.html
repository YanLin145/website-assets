<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YANISKY Navigation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      background: #ffffff;
      color: #222222;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    button,
    a {
      font: inherit;
      color: inherit;
    }


    /* =========================
       HEADER
       ========================= */

    .site-header {
      width: 100%;
      min-height: 68px;

      display: flex;
      align-items: center;

      padding: 0 28px;
      gap: 42px;

      white-space: nowrap;
    }


    /* =========================
       LOGO
       ========================= */

    .site-logo {
  flex-shrink: 0;

  color: inherit;
  text-decoration: none;

  font-size: 15px;
  font-weight: 650;

  /*
    Обычное состояние.
    Оставляем буквы почти как сейчас.
  */
  letter-spacing: 0.04em;

  /*
    Плавное раздвижение букв.
  */
  transition: letter-spacing 260ms ease;

  /*
    Чтобы расширение логотипа происходило
    визуально аккуратно.
  */
  white-space: nowrap;
}


/* YANISKY при наведении */

.site-logo:hover {
  letter-spacing: 0.18em;
}


    /* =========================
       MAIN NAVIGATION
       ========================= */

    .main-navigation {
      display: flex;
      align-items: center;

      gap: 30px;
    }

    .nav-group {
      position: relative;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      margin: 0;
      padding: 0;

      border: 0;
      background: none;

      color: inherit;
      text-decoration: none;

      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.035em;

      cursor: pointer;

      opacity: 1;

      transition:
        opacity 160ms ease;
    }


    /* Hover основной навигации */

    .nav-link:hover {
      opacity: 0.6;
    }


    /* Открытый раздел остаётся
       слегка прозрачным */

    .nav-group.open > .nav-trigger {
      opacity: 0.6;
    }


    /* =========================
       CHEVRON
       ========================= */

    .chevron {
      display: inline-block;

      width: 6px;
      height: 6px;

      margin-top: -3px;

      border-right: 1px solid currentColor;
      border-bottom: 1px solid currentColor;

      transform: rotate(45deg);
      transform-origin: center;

      transition:
        transform 180ms ease;
    }


    /* Поворот стрелки */

    .nav-group.open .chevron {
      transform: rotate(225deg);
    }


    /* =========================
       DROPDOWN
       ========================= */

    .dropdown {
      position: absolute;

      top: 100%;
      left: 0;

      min-width: max-content;

      padding-top: 12px;

      z-index: 10;

      visibility: hidden;
      pointer-events: none;

      opacity: 0;

      transform: translateY(-5px);

      transition:
        opacity 170ms ease,
        transform 170ms ease,
        visibility 170ms;
    }


    /* Открытый dropdown */

    .nav-group.open .dropdown {
      visibility: visible;
      pointer-events: auto;

      opacity: 1;

      transform: translateY(0);
    }


    .dropdown-link {
      display: block;

      padding: 5px 0;

      color: inherit;
      text-decoration: none;

      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.035em;

      opacity: 1;

      transition:
        opacity 160ms ease;
    }


    /* Hover подпунктов */

    .dropdown-link:hover {
      opacity: 0.6;
    }


    /* =========================
       LANGUAGE
       ========================= */

    .language-switcher {
      margin-left: auto;

      display: flex;
      align-items: center;
      gap: 7px;

      flex-shrink: 0;

      font-size: 12px;
      letter-spacing: 0.035em;
    }

    .language-button {
      margin: 0;
      padding: 0;

      border: 0;
      background: none;

      color: inherit;

      cursor: pointer;

      opacity: 1;

      transition:
        opacity 160ms ease;
    }

    .language-divider {
      opacity: 0.35;
    }

    .language-button:not(.active) {
      opacity: 0.55;
    }

    .language-button:not(.active):hover {
      opacity: 0.8;
    }


    /* =========================
       DARK MODE
       ========================= */

    @media (prefers-color-scheme: dark) {

      body {
        background: #191919;
        color: #ffffff;
      }

    }


    /* =========================
       NARROW DESKTOP
       ========================= */

    @media (max-width: 900px) {

      .site-header {
        padding-left: 20px;
        padding-right: 20px;

        gap: 26px;
      }

      .main-navigation {
        gap: 20px;
      }

    }

  </style>
</head>


<body>

  <header class="site-header">

    <!-- YANISKY → HOME -->

    <a
      class="site-logo"
      href="https://yanisky.notion.site/HOME-3db0d2878cbc808fb034e28b97c5004c?source=copy_link"
    >
      YANISKY
    </a>


    <nav
      class="main-navigation"
      aria-label="Main navigation"
    >


      <!-- ART -->

      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >
          ART

          <span
            class="chevron"
            aria-hidden="true"
          ></span>
        </button>


        <div class="dropdown">

          <a
            class="dropdown-link"
            href="https://yanisky.notion.site/TRADISH-3db0d2878cbc803398b9e85a9b22e863?source=copy_link"
          >
            TRADITIONAL
          </a>

          <a
            class="dropdown-link"
            href="https://yanisky.notion.site/DIDG-3db0d2878cbc8008b535c5d53d41cb9b?source=copy_link"
          >
            DIGITAL
          </a>

        </div>

      </div>


      <!-- PROJECTS -->

      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >
          PROJECTS

          <span
            class="chevron"
            aria-hidden="true"
          ></span>
        </button>


        <div class="dropdown">

          <a
            class="dropdown-link"
            href="https://yanisky.notion.site/GAME-3db0d2878cbc8062a680d9105798954d?source=copy_link"
          >
            GAMES
          </a>

        </div>

      </div>


      <!-- EVENTS -->

      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >
          EVENTS

          <span
            class="chevron"
            aria-hidden="true"
          ></span>
        </button>


        <div class="dropdown">

          <a
            class="dropdown-link"
            href="https://yanisky.notion.site/EXHIBITIONS-OPEN-CALLS-3de0d2878cbc80599898cef2c442a3bc?source=copy_link"
          >
            EXHIBITIONS &amp; OPEN CALLS
          </a>

          <a
            class="dropdown-link"
            href="https://yanisky.notion.site/GAME-JAMS-3de0d2878cbc80bba869dd27e02074d1?source=copy_link"
          >
            GAME JAMS
          </a>

        </div>

      </div>


      <!-- ABOUT / CONTACT -->

      <a
        class="nav-link"
        href="https://yanisky.notion.site/ME-3db0d2878cbc806881c4c1400e68421a?source=copy_link"
      >
        ABOUT / CONTACT
      </a>

    </nav>


    <!-- LANGUAGE -->

    <div
      class="language-switcher"
      aria-label="Language"
    >

      <button
        class="language-button active"
        type="button"
        data-language="en"
      >
        EN
      </button>

      <span class="language-divider">
        |
      </span>

      <button
        class="language-button"
        type="button"
        data-language="ru"
      >
        RU
      </button>

    </div>

  </header>


  <script>

    const navGroups =
      document.querySelectorAll(".nav-group");


    function openDropdown(group) {

      navGroups.forEach((otherGroup) => {

        if (otherGroup !== group) {
          closeDropdown(otherGroup);
        }

      });

      group.classList.add("open");

      const trigger =
        group.querySelector(".nav-trigger");

      trigger.setAttribute(
        "aria-expanded",
        "true"
      );

    }


    function closeDropdown(group) {

      group.classList.remove("open");

      const trigger =
        group.querySelector(".nav-trigger");

      trigger.setAttribute(
        "aria-expanded",
        "false"
      );

    }


    function closeAllDropdowns() {

      navGroups.forEach((group) => {
        closeDropdown(group);
      });

    }


    navGroups.forEach((group) => {

      const trigger =
        group.querySelector(".nav-trigger");


      /* Hover */

      group.addEventListener(
        "mouseenter",
        () => {
          openDropdown(group);
        }
      );


      group.addEventListener(
        "mouseleave",
        () => {
          closeDropdown(group);
        }
      );


      /* Click */

      trigger.addEventListener(
        "click",
        (event) => {

          event.stopPropagation();

          const isOpen =
            group.classList.contains("open");

          if (isOpen) {
            closeDropdown(group);
          } else {
            openDropdown(group);
          }

        }
      );

    });


    /* Клик вне меню */

    document.addEventListener(
      "click",
      () => {
        closeAllDropdowns();
      }
    );


    /* Escape */

    document.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Escape") {
          closeAllDropdowns();
        }

      }
    );

  </script>

</body>
</html>
