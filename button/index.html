<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .art-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .art-button img {
      display: block;

      width: auto;
      height: auto;

      image-rendering: pixelated;

      transform: scale(1) rotate(0deg);
      transform-origin: center center;

      transition: transform 0.25s ease;
    }

    .art-button:hover img {
      transform: scale(1.35) rotate(12deg);
    }
  </style>
</head>

<body>

  <a
    class="art-button"
    id="button-link"
    href="#"
    target="_blank"
  >
    <img
      id="button-image"
      alt="Interactive button"
    >
  </a>

  <script>
    const params = new URLSearchParams(window.location.search);

    const imageName = params.get("image");
    const targetLink = params.get("link");

    const image = document.getElementById("button-image");
    const button = document.getElementById("button-link");

    if (targetLink) {
      button.href = targetLink;
    }

    if (imageName) {

      image.src = "../" + imageName;

      image.onload = function () {

        function resizeImage() {

          const frameWidth = window.innerWidth;
          const frameHeight = window.innerHeight;

          const imageWidth = image.naturalWidth;
          const imageHeight = image.naturalHeight;

          /*
            Оставляем свободное пространство
            для увеличения и поворота.
          */

          const safeArea = 0.60;

          const availableWidth =
            frameWidth * safeArea;

          const availableHeight =
            frameHeight * safeArea;

          /*
            Вычисляем масштаб отдельно
            для ширины и высоты.
          */

          const widthScale =
            availableWidth / imageWidth;

          const heightScale =
            availableHeight / imageHeight;

          /*
            Берём меньшее значение.
            Благодаря этому картинка всегда
            помещается в рамку целиком.
          */

          const scale =
            Math.min(widthScale, heightScale);

          image.style.width =
            (imageWidth * scale) + "px";

          image.style.height =
            (imageHeight * scale) + "px";
        }

        resizeImage();

        window.addEventListener(
          "resize",
          resizeImage
        );
      };
    }
  </script>

</body>

</html>
