<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Notebook Viewer</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #ffffff;

      overflow: hidden;
    }


    @media (prefers-color-scheme: dark) {

      html,
      body {
        background: #191919;
      }

    }


    body {
      display: flex;

      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;
    }


    .notebook {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

      padding: 20px;

      box-sizing: border-box;
    }


    .page-area {
      flex: 1;

      min-height: 0;

      width: 100%;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    #page-image {
      display: block;

      max-width: 100%;
      max-height: 100%;

      width: auto;
      height: auto;

      object-fit: contain;

      transition:
        opacity 0.22s ease,
        transform 0.22s ease;
    }


    #page-image.changing {
      opacity: 0;

      transform: scale(0.98);
    }


    .page-numbers {
      display: flex;

      justify-content: center;
      align-items: center;

      flex-wrap: wrap;

      gap: 8px;

      padding-top: 16px;
    }


    .page-number {
      appearance: none;

      border: 0;
      background: transparent;

      padding: 4px 7px;

      font: inherit;
      font-size: 14px;

      color: #555555;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }


    .page-number:hover {
      transform: scale(1.2);
    }


    .page-number.active {
      font-weight: bold;

      text-decoration: underline;

      color: #111111;
    }


    @media (prefers-color-scheme: dark) {

      .page-number {
        color: #aaaaaa;
      }


      .page-number.active {
        color: #ffffff;
      }

    }

  </style>
</head>


<body>

  <div class="notebook">

    <div class="page-area">

      <img
        id="page-image"
        alt="Notebook page"
      >

    </div>


    <div
      class="page-numbers"
      id="page-numbers"
    ></div>

  </div>


  <script>

    const params =
      new URLSearchParams(
        window.location.search
      );


    /*
      Получаем список страниц из URL.

      Например:

      ?pages=page-1.png,page-2.png,page-3.png
    */

    const pagesParameter =
      params.get("pages");


    let pages = [];


    if (pagesParameter) {

      pages =
        pagesParameter
          .split(",")
          .map(page => page.trim())
          .filter(page => page !== "");

    }


    const pageImage =
      document.getElementById(
        "page-image"
      );


    const pageNumbers =
      document.getElementById(
        "page-numbers"
      );


    let currentPage = 0;


    /*
      Показываем выбранную страницу.
    */

    function showPage(index, animate = true) {

      if (
        index < 0 ||
        index >= pages.length
      ) {
        return;
      }


      currentPage = index;


      function changeImage() {

        pageImage.src =
          "../" + pages[index];


        updateActiveNumber();

      }


      if (!animate) {

        changeImage();

        return;
      }


      pageImage.classList.add(
        "changing"
      );


      setTimeout(
        changeImage,
        180
      );

    }


    /*
      Когда новая картинка загрузилась,
      плавно показываем её.
    */

    pageImage.addEventListener(
      "load",
      function () {

        requestAnimationFrame(
          function () {

            pageImage.classList.remove(
              "changing"
            );

          }
        );

      }
    );


    /*
      Создаём столько цифр,
      сколько существует страниц.
    */

    function createPageNumbers() {

      pageNumbers.innerHTML = "";


      pages.forEach(
        function (page, index) {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "page-number";


          button.textContent =
            index + 1;


          button.addEventListener(
            "click",
            function () {

              if (
                index !== currentPage
              ) {

                showPage(index);

              }

            }
          );


          pageNumbers.appendChild(
            button
          );

        }
      );

    }


    /*
      Выделяем номер открытой страницы.
    */

    function updateActiveNumber() {

      const buttons =
        document.querySelectorAll(
          ".page-number"
        );


      buttons.forEach(
        function (button, index) {

          button.classList.toggle(
            "active",
            index === currentPage
          );

        }
      );

    }


    /*
      Запуск блокнота.
    */

    if (pages.length > 0) {

      createPageNumbers();

      showPage(
        0,
        false
      );

    }

    else {

      pageNumbers.textContent =
        "Страницы не добавлены.";

    }

  </script>

</body>

</html>
