<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Notebook Viewer</title>

  <style>

    /*
      СТРАНИЦА ВИДЖЕТА
    */

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #ffffff;
    }


    /*
      Автоматическая тёмная тема
    */

    @media (prefers-color-scheme: dark) {

      html,
      body {
        background: #191919;
      }

    }


    body {
      font-family: Arial, sans-serif;
    }


    /*
      ВЕСЬ БЛОКНОТ
    */

    .notebook {
      display: flex;

      flex-direction: column;

      align-items: center;

      width: 100%;

      padding: 20px;

      box-sizing: border-box;
    }


    /*
      ОБЛАСТЬ ИЗОБРАЖЕНИЯ

      Здесь больше нет flex: 1.
      Поэтому навигация будет находиться
      сразу под картинкой.
    */

    .page-area {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;
    }


    /*
      СТРАНИЦА БЛОКНОТА
    */

    #page-image {
      display: block;

      max-width: 100%;
      max-height: 80vh;

      width: auto;
      height: auto;

      object-fit: contain;
    }


    /*
      НАВИГАЦИЯ ПОД БЛОКНОТОМ
    */

    .navigation {
      display: flex;

      justify-content: center;
      align-items: center;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 10px;
    }


    /*
      ЦИФРЫ
    */

    .page-numbers {
      display: flex;

      justify-content: center;
      align-items: center;

      flex-wrap: wrap;

      gap: 5px;
    }


    .page-number {
      appearance: none;

      border: 0;
      background: transparent;

      padding: 4px 6px;

      font: inherit;
      font-size: 14px;

      color: #222222;

      cursor: pointer;

      opacity: 1;

      transition:
        opacity 0.15s ease,
        transform 0.15s ease;
    }


    .page-number:hover {
      transform: scale(1.15);
    }


    /*
      Активная страница.

      Только прозрачность.
      Никакого подчёркивания
      или жирного текста.
    */

    .page-number.active {
      opacity: 0.5;
    }


    /*
      СТРЕЛКИ
    */

    .arrow {
      appearance: none;

      border: 0;
      background: transparent;

      padding: 4px 8px;

      font-size: 18px;

      color: #222222;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }


    .arrow:hover:not(:disabled) {
      transform: scale(1.2);
    }


    /*
      Если дальше листать нельзя,
      стрелка становится менее заметной.
    */

    .arrow:disabled {
      opacity: 0.2;

      cursor: default;
    }


    /*
      ТЁМНАЯ ТЕМА НАВИГАЦИИ
    */

    @media (prefers-color-scheme: dark) {

      .page-number,
      .arrow {
        color: #ffffff;
      }

    }

  </style>
</head>


<body>

  <div class="notebook">


    <!-- ИЗОБРАЖЕНИЕ -->

    <div class="page-area">

      <img
        id="page-image"
        alt="Notebook page"
      >

    </div>


    <!-- НАВИГАЦИЯ -->

    <div class="navigation">


      <!-- НАЗАД -->

      <button
        class="arrow"
        id="previous-page"
        aria-label="Предыдущая страница"
      >
        ◀
      </button>


      <!-- ЦИФРЫ -->

      <div
        class="page-numbers"
        id="page-numbers"
      ></div>


      <!-- ВПЕРЁД -->

      <button
        class="arrow"
        id="next-page"
        aria-label="Следующая страница"
      >
        ➤
      </button>


    </div>

  </div>


  <script>

    /*
      ЧИТАЕМ СТРАНИЦЫ ИЗ URL
    */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const pagesParameter =
      params.get("pages");


    let pages = [];


    if (pagesParameter) {

      pages =
        pagesParameter
          .split(",")
          .map(
            page => page.trim()
          )
          .filter(
            page => page !== ""
          );

    }


    /*
      ЭЛЕМЕНТЫ
    */

    const pageImage =
      document.getElementById(
        "page-image"
      );


    const pageNumbers =
      document.getElementById(
        "page-numbers"
      );


    const previousButton =
      document.getElementById(
        "previous-page"
      );


    const nextButton =
      document.getElementById(
        "next-page"
      );


    /*
      ТЕКУЩАЯ СТРАНИЦА

      0 = первая
      1 = вторая
      2 = третья
      и так далее.
    */

    let currentPage = 0;


    /*
      ПОКАЗАТЬ СТРАНИЦУ
    */

    function showPage(index) {

      if (
        index < 0 ||
        index >= pages.length
      ) {

        return;

      }


      currentPage =
        index;


      /*
        Просто меняем картинку.

        Никакого fade,
        opacity или другой
        анимации изображения.
      */

      pageImage.src =
        "../" + pages[index];


      updateNavigation();

    }


    /*
      СОЗДАЁМ ЦИФРЫ

      Количество цифр автоматически
      равно количеству изображений.
    */

    function createPageNumbers() {

      pageNumbers.innerHTML =
        "";


      pages.forEach(
        function (page, index) {


          const button =
            document.createElement(
              "button"
            );


          button.className =
            "page-number";


          button.textContent =
            index + 1;


          button.addEventListener(
            "click",
            function () {

              showPage(index);

            }
          );


          pageNumbers.appendChild(
            button
          );

        }
      );

    }


    /*
      ОБНОВЛЯЕМ НАВИГАЦИЮ
    */

    function updateNavigation() {


      /*
        Активная цифра получает
        прозрачность 50%.

        Предыдущая активная цифра
        автоматически снова становится
        полностью непрозрачной.
      */

      const numberButtons =
        document.querySelectorAll(
          ".page-number"
        );


      numberButtons.forEach(
        function (button, index) {

          button.classList.toggle(
            "active",
            index === currentPage
          );

        }
      );


      /*
        На первой странице
        нельзя идти назад.
      */

      previousButton.disabled =
        currentPage === 0;


      /*
        На последней странице
        нельзя идти вперёд.
      */

      nextButton.disabled =
        currentPage ===
        pages.length - 1;

    }


    /*
      СТРЕЛКА НАЗАД
    */

    previousButton.addEventListener(
      "click",
      function () {

        showPage(
          currentPage - 1
        );

      }
    );


    /*
      СТРЕЛКА ВПЕРЁД
    */

    nextButton.addEventListener(
      "click",
      function () {

        showPage(
          currentPage + 1
        );

      }
    );


    /*
      ЗАПУСК
    */

    if (pages.length > 0) {

      createPageNumbers();

      showPage(0);

    }

    else {

      /*
        Если в ссылке нет картинок,
        скрываем навигацию.
      */

      document
        .querySelector(
          ".navigation"
        )
        .style
        .display =
        "none";

    }

  </script>

</body>

</html>
