<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Notebook Viewer</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    @media (prefers-color-scheme: dark) {

      html,
      body {
        background: #191919;
      }

    }

    body {
      font-family: Arial, sans-serif;
    }


    /* NOTEBOOK */

    .notebook {
      display: flex;
      flex-direction: column;
      align-items: center;

      width: 100%;

      padding: 20px;

      box-sizing: border-box;
    }


    /* IMAGE */

    .page-area {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
    }

    #page-image {
      display: block;

      max-width: 100%;
      max-height: 80vh;

      width: auto;
      height: auto;

      object-fit: contain;
    }


    /* NAVIGATION */

    .navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;

      gap: 8px;

      margin-top: 10px;
    }

    .page-numbers {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;

      gap: 5px;
    }


    /* PAGE NUMBERS */

    .page-number {
      appearance: none;

      border: 0;
      background: transparent;

      padding: 4px 6px;

      font: inherit;
      font-size: 14px;

      color: #222222;

      cursor: pointer;

      opacity: 1;

      transition:
        opacity 0.15s ease,
        transform 0.15s ease;
    }

    .page-number:hover {
      transform: scale(1.15);
    }

    .page-number.active {
      opacity: 0.5;
    }


    /* ARROWS */

    .arrow {
      appearance: none;

      border: 0;
      background: transparent;

      padding: 4px 8px;

      font-size: 18px;

      color: #222222;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .arrow:hover:not(:disabled) {
      transform: scale(1.2);
    }

    .arrow:disabled {
      opacity: 0.2;
      cursor: default;
    }


    /* DARK MODE */

    @media (prefers-color-scheme: dark) {

      .page-number,
      .arrow {
        color: #ffffff;
      }

    }

  </style>
</head>


<body>

  <div class="notebook">

    <div class="page-area">

      <img
        id="page-image"
        alt="Notebook page"
      >

    </div>


    <div class="navigation">

      <button
        class="arrow"
        id="previous-page"
        aria-label="Предыдущая страница"
      >
        ◀
      </button>


      <div
        class="page-numbers"
        id="page-numbers"
      ></div>


      <button
        class="arrow"
        id="next-page"
        aria-label="Следующая страница"
      >
        ➤
      </button>

    </div>

  </div>


  <script>

    /* -------------------------------- */
    /* READ PAGES FROM URL              */
    /* -------------------------------- */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const pagesParameter =
      params.get("pages");


    let pages = [];


    if (pagesParameter) {

      pages =
        pagesParameter
          .split(",")
          .map(
            page => page.trim()
          )
          .filter(
            page => page !== ""
          );

    }


    /*
      Safety rule:

      _00 is always a cover.
      It must never appear
      inside the notebook viewer.
    */

    pages =
      pages.filter(
        page =>
          !/_00\.[^.]+$/i.test(page)
      );


    /* -------------------------------- */
    /* ELEMENTS                         */
    /* -------------------------------- */

    const pageImage =
      document.getElementById(
        "page-image"
      );


    const pageNumbers =
      document.getElementById(
        "page-numbers"
      );


    const previousButton =
      document.getElementById(
        "previous-page"
      );


    const nextButton =
      document.getElementById(
        "next-page"
      );


    const navigation =
      document.querySelector(
        ".navigation"
      );


    let currentPage = 0;


    /* -------------------------------- */
    /* SHOW PAGE                        */
    /* -------------------------------- */

    function showPage(index) {

      if (
        index < 0 ||
        index >= pages.length
      ) {
        return;
      }


      currentPage =
        index;


      pageImage.src =
        "../" + pages[index];


      updateNavigation();

    }


    /* -------------------------------- */
    /* CREATE PAGE NUMBERS              */
    /* -------------------------------- */

    function createPageNumbers() {

      pageNumbers.innerHTML =
        "";


      pages.forEach(
        function (page, index) {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "page-number";


          button.textContent =
            index + 1;


          button.addEventListener(
            "click",
            function () {

              showPage(index);

            }
          );


          pageNumbers.appendChild(
            button
          );

        }
      );

    }


    /* -------------------------------- */
    /* UPDATE NAVIGATION                */
    /* -------------------------------- */

    function updateNavigation() {

      const numberButtons =
        document.querySelectorAll(
          ".page-number"
        );


      numberButtons.forEach(
        function (button, index) {

          button.classList.toggle(
            "active",
            index === currentPage
          );

        }
      );


      previousButton.disabled =
        currentPage === 0;


      nextButton.disabled =
        currentPage ===
        pages.length - 1;

    }


    /* -------------------------------- */
    /* PREVIOUS PAGE                    */
    /* -------------------------------- */

    previousButton.addEventListener(
      "click",
      function () {

        showPage(
          currentPage - 1
        );

      }
    );


    /* -------------------------------- */
    /* NEXT PAGE                        */
    /* -------------------------------- */

    nextButton.addEventListener(
      "click",
      function () {

        showPage(
          currentPage + 1
        );

      }
    );


    /* -------------------------------- */
    /* START                            */
    /* -------------------------------- */

    if (pages.length > 0) {

      createPageNumbers();

      showPage(0);

    }

    else {

      navigation.style.display =
        "none";

      pageImage.style.display =
        "none";

    }

  </script>

</body>

</html>
